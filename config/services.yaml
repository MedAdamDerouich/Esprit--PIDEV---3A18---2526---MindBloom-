parameters:
    produit_images_directory: '%kernel.project_dir%/public/uploads/produits'
    openai_api_key: '%env(OPENAI_API_KEY)%'
    huggingface_api_key: '%env(HUGGINGFACE_API_KEY)%'
    anthropic_api_key: '%env(ANTHROPIC_API_KEY)%'
    groq_api_key: '%env(GROQ_API_KEY)%'
    google_maps_api_key: '%env(GOOGLE_MAPS_API_KEY)%'
    fonnte_token: '%env(FONNTE_TOKEN)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $groqApiKey: '%env(GROQ_API_KEY)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\StripeService:
        arguments:
            $secretKey: '%env(STRIPE_SECRET_KEY)%'

    App\Service\ModerationService:
        arguments:
            $apiKey: '%openai_api_key%'

    App\Service\SentimentService: ~

    App\Service\RecaptchaService:
        arguments:
            $secretKey: '%env(RECAPTCHA_SECRET_KEY)%'

    App\Service\EvenementAiService:
        arguments:
            $geminiApiKey: '%env(default::GEMINI_API_KEY_WALLET)%'

    App\Service\GeminiReportService:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY_3)%'

    App\Service\WhatsAppService:
        arguments:
            $token: '%env(FONNTE_TOKEN)%'

    Symfony\Component\Security\Http\Authenticator\FormLoginAuthenticator:
        alias: security.authenticator.form_login.main
        public: true

    geocoder.http_client:
        class: GuzzleHttp\Client

    geocoder.google_maps:
        class: Geocoder\Provider\GoogleMaps\GoogleMaps
        arguments:
            - '@geocoder.http_client'
            - null
            - '%env(GOOGLE_MAPS_API_KEY)%'

    Geocoder\StatefulGeocoder:
        arguments:
            - '@geocoder.google_maps'
            - 'fr'

    App\EventListener\LoginListener:
        tags:
            - { name: kernel.event_listener, event: security.interactive_login, method: onSecurityInteractiveLogin }